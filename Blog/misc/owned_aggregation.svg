<svg viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/>
        </marker>
    </defs>

    <!-- Gameplay & UI Logic -->
    <rect x="200" y="20" width="500" height="60" rx="6" fill="#EDF2F7" stroke="#4A5568" stroke-width="1.5"/>
    <text x="450" y="56" text-anchor="middle" font-size="18" font-weight="600" fill="#1A202C">Gameplay &amp; UI Logic</text>

    <!-- request / merged result pair -->
    <line x1="370" y1="80" x2="370" y2="118" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="300" y="103" text-anchor="end" font-size="10" fill="#718096">request</text>
    <line x1="530" y1="118" x2="530" y2="80" stroke="#4A5568" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <text x="600" y="103" text-anchor="start" font-size="10" fill="#718096">merged result</text>

    <!-- Owned Aggregation Layer -->
    <rect x="150" y="120" width="600" height="130" rx="6" fill="#F0FFF4" stroke="#38A169" stroke-width="1.5"/>
    <text x="450" y="148" text-anchor="middle" font-size="18" font-weight="700" fill="#22543D">Owned Aggregation Layer</text>
    <text x="180" y="172" font-size="13" fill="#22543D">- Dispatches parallel requests</text>
    <text x="180" y="194" font-size="13" fill="#22543D">- Unifies disparate schemas</text>
    <text x="480" y="172" font-size="13" fill="#22543D">- Pools warm connections</text>
    <rect x="692" y="163" width="46" height="16" rx="8" fill="#C6F6D5" stroke="#38A169" stroke-width="1"/>
    <text x="715" y="175" text-anchor="middle" font-size="9" font-weight="600" fill="#22543D">warm</text>
    <text x="480" y="194" font-size="13" fill="#22543D">- Handles graceful fallbacks</text>
    <text x="450" y="232" text-anchor="middle" font-size="11" font-style="italic" fill="#2F855A">Resolves Identity first (1); Economy and Social dispatch together once the token exists (2)</text>

    <!-- all three calls originate from the aggregator itself -->
    <line x1="160" y1="250" x2="160" y2="288" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow)"/>
    <circle cx="200" cy="269" r="9" fill="#4A5568"/>
    <text x="200" y="273" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">1</text>
    <!-- Identity's token flows back to the aggregator before it dispatches step 2 -->
    <line x1="180" y1="288" x2="180" y2="250" stroke="#4A5568" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

    <line x1="450" y1="250" x2="450" y2="288" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow)"/>
    <circle cx="470" cy="269" r="9" fill="#4A5568"/>
    <text x="470" y="273" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">2</text>

    <line x1="720" y1="250" x2="720" y2="288" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow)"/>
    <circle cx="740" cy="269" r="9" fill="#4A5568"/>
    <text x="740" y="273" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">2</text>

    <!-- Identity API -->
    <rect x="70" y="290" width="220" height="70" rx="6" fill="#FFFAF0" stroke="#DD6B20" stroke-width="1.5"/>
    <text x="180" y="320" text-anchor="middle" font-size="15" font-weight="600" fill="#9C4221">Identity API</text>
    <text x="180" y="340" text-anchor="middle" font-size="12" fill="#9C4221">(EOS)</text>

    <!-- Economy API -->
    <rect x="340" y="290" width="220" height="70" rx="6" fill="#FFFAF0" stroke="#DD6B20" stroke-width="1.5"/>
    <text x="450" y="320" text-anchor="middle" font-size="15" font-weight="600" fill="#9C4221">Economy API</text>
    <text x="450" y="340" text-anchor="middle" font-size="12" fill="#9C4221">(PlayFab)</text>

    <!-- Social API -->
    <rect x="610" y="290" width="220" height="70" rx="6" fill="#FFFAF0" stroke="#DD6B20" stroke-width="1.5"/>
    <text x="720" y="320" text-anchor="middle" font-size="15" font-weight="600" fill="#9C4221">Social API</text>
    <text x="720" y="340" text-anchor="middle" font-size="12" fill="#9C4221">(Nakama)</text>
</svg>