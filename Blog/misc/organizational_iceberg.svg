<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="Helvetica, Arial, sans-serif">
  <text x="450" y="26" text-anchor="middle" font-size="19" font-weight="600" fill="#1A202C">
    The Organizational Iceberg
  </text>
  <text x="450" y="46" text-anchor="middle" font-size="12.5" fill="#4A5568">
    What hiring selects for sits above the waterline. What sustains it doesn't.
  </text>

  <!-- water -->
  <rect x="0" y="170" width="900" height="470" fill="#BEE3F8"/>
  <line x1="0" y1="170" x2="900" y2="170" stroke="#2B6CB0" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="12" y="164" font-size="11" fill="#2B6CB0">waterline</text>

  <!-- tip -->
  <polygon points="300,170 600,170 450,60" fill="#F7FAFC" stroke="#4A5568" stroke-width="1.5"/>
  <text x="450" y="129" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1A202C">Notices Critical Points,</text>
  <text x="450" y="145" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1A202C">Builds a Fix</text>
  <text x="450" y="161" text-anchor="middle" font-size="11.5" fill="#4A5568">What hiring actually selects for.</text>

  <!-- segment 1 -->
  <rect x="290" y="170" width="320" height="90" fill="#CBD5E0" stroke="#4A5568" stroke-width="1"/>
  <text x="450" y="200" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1A202C">Signal Recognition</text>
  <text x="450" y="220" text-anchor="middle" font-size="12.5" fill="#2D3748">Noticing happens constantly.</text>
  <text x="450" y="238" text-anchor="middle" font-size="12.5" fill="#2D3748">It rarely becomes a pattern anyone tracks.</text>

  <!-- segment 2 -->
  <rect x="240" y="260" width="420" height="100" fill="#A0AEC0" stroke="#4A5568" stroke-width="1"/>
  <text x="450" y="295" text-anchor="middle" font-size="14.5" font-weight="600" fill="#F7FAFC">One-Time Resourcing</text>
  <text x="450" y="315" text-anchor="middle" font-size="12.5" fill="#EDF2F7">Looks like support.</text>
  <text x="450" y="333" text-anchor="middle" font-size="12.5" fill="#EDF2F7">Isn't a system.</text>

  <!-- segment 3 -->
  <rect x="190" y="360" width="520" height="110" fill="#718096" stroke="#4A5568" stroke-width="1"/>
  <text x="450" y="400" text-anchor="middle" font-size="14.5" font-weight="600" fill="#F7FAFC">Adoption Failure</text>
  <text x="450" y="420" text-anchor="middle" font-size="12.5" fill="#EDF2F7">A known bad number beats an unknown one,</text>
  <text x="450" y="438" text-anchor="middle" font-size="12.5" fill="#EDF2F7">absent a reason to prefer the alternative.</text>

  <!-- segment 4 -->
  <rect x="140" y="470" width="620" height="130" fill="#4A5568" stroke="#2D3748" stroke-width="1"/>
  <text x="450" y="520" text-anchor="middle" font-size="14.5" font-weight="600" fill="#FFFFFF">Enforcement Defaults to the Builder</text>
  <text x="450" y="540" text-anchor="middle" font-size="12.5" fill="#E2E8F0">No horizontal role exists to catch</text>
  <text x="450" y="558" text-anchor="middle" font-size="12.5" fill="#E2E8F0">what one reviewer's blind spots miss.</text>

  <text x="450" y="660" text-anchor="middle" font-size="12.5" fill="#2D3748">
    Each layer below the waterline is something one engineer's hours cannot supply alone.
  </text>
</svg>