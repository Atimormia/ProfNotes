<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 770" width="100%" height="100%">
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 8 5 L 0 9 z" fill="#475569" />
        </marker>
        <marker id="arrow-active" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 8 5 L 0 9 z" fill="#94A3B8" />
        </marker>
        <linearGradient id="axisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#F43F5E" />
            <stop offset="50%" stop-color="#D97706" />
            <stop offset="100%" stop-color="#10B981" />
        </linearGradient>
    </defs>

    <style>
        .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 1.5px; fill: #94A3B8; text-transform: uppercase; }
        .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #64748B; }
        .axis-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1px; }
        .rung-title { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; font-weight: 700; letter-spacing: 0.5px; }
        .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 600; fill: #F8FAFC; }
        .card-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; fill: #94A3B8; }
        .badge { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10.5px; font-weight: 700; letter-spacing: 0.5px; }
        .legend-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #cbd5e1; }
    </style>

    <rect width="940" height="770" rx="12" fill="#090D16" stroke="#1E293B" stroke-width="1.5" />

    <text x="45" y="44" class="title">The Modernization Ladder &#38; Seam Decision Matrix</text>
    <text x="45" y="65" class="subtitle">Subsystem intervention rungs dictated by the presence or absence of Michael Feathers' seams</text>

    <!-- Cost Axis: now spans row 1 center (146) to row 5 center (618), with a tick per rung -->
    <text x="45" y="112" class="axis-label" fill="#F43F5E" text-anchor="middle">MOST</text>
    <text x="45" y="125" class="axis-label" fill="#F43F5E" text-anchor="middle">EXPENSIVE</text>
    <line x1="45" y1="146" x2="45" y2="618" stroke="url(#axisGrad)" stroke-width="2.5" stroke-linecap="round" />
    <text x="45" y="648" class="axis-label" fill="#10B981" text-anchor="middle">CHEAPEST</text>

    <!-- Axis ticks, one per rung, colored to match that rung's status -->
    <line x1="38" y1="146" x2="52" y2="146" stroke="#F43F5E" stroke-width="2" />
    <line x1="38" y1="264" x2="52" y2="264" stroke="#64748B" stroke-width="2" />
    <line x1="38" y1="382" x2="52" y2="382" stroke="#D97706" stroke-width="2" />
    <line x1="38" y1="500" x2="52" y2="500" stroke="#64748B" stroke-width="2" />
    <line x1="38" y1="618" x2="52" y2="618" stroke="#10B981" stroke-width="2" />

    <line x1="205" y1="146" x2="205" y2="618" stroke="#1E293B" stroke-width="3" />

    <!-- ==================== RUNG 1: REBUILD (Occupied) ==================== -->
    <g transform="translate(0, 100)">
        <rect x="90" y="0" width="230" height="92" rx="8" fill="#2a0f19" stroke="#e11d48" stroke-width="1.5" />
        <text x="205" y="51" class="rung-title" fill="#FDA4AF" text-anchor="middle">REBUILD / REPLACE</text>

        <line x1="320" y1="46" x2="362" y2="46" stroke="#e11d48" stroke-width="1.5" marker-end="url(#arrow-active)" />

        <rect x="370" y="0" width="525" height="92" rx="8" fill="#111827" stroke="#1E293B" stroke-width="1" />
        <text x="390" y="27" class="card-title">Map loading, scene assembly &amp; authoring</text>
        <text x="390" y="49" class="card-desc">Zero seams anywhere in the coupling.</text>
        <text x="390" y="66" class="card-desc">Git collisions were already blocking daily work.</text>

        <rect x="785" y="14" width="95" height="22" rx="4" fill="#4C0519" stroke="#e11d48" stroke-width="1" />
        <text x="832" y="29" class="badge" fill="#FECDD3" text-anchor="middle">SEAM: NONE</text>
    </g>

    <!-- ==================== RUNG 2: REARCHITECT (Bypassed) ==================== -->
    <g transform="translate(0, 218)">
        <rect x="90" y="0" width="230" height="92" rx="8" fill="#0B1120" stroke="#334155" stroke-width="1.5" stroke-dasharray="5,4" />
        <text x="205" y="51" class="rung-title" fill="#64748B" text-anchor="middle">REARCHITECT</text>

        <line x1="320" y1="46" x2="362" y2="46" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)" />

        <rect x="370" y="0" width="525" height="92" rx="8" fill="#0B1120" stroke="#1E293B" stroke-width="1" stroke-dasharray="5,4" />
        <text x="390" y="27" class="card-title" fill="#64748B">Decoupled event bus / dependency injection</text>
        <text x="390" y="49" class="card-desc" fill="#475569">Rearchitecting redesigns the connections between</text>
        <text x="390" y="66" class="card-desc" fill="#475569">existing modules. A fused scene had none to redesign.</text>

        <rect x="785" y="14" width="95" height="22" rx="4" fill="#1E293B" />
        <text x="832" y="29" class="badge" fill="#64748B" text-anchor="middle">BYPASSED</text>
    </g>

    <!-- ==================== RUNG 3: REFACTOR (Occupied) ==================== -->
    <g transform="translate(0, 336)">
        <rect x="90" y="0" width="230" height="92" rx="8" fill="#2a1e0c" stroke="#d97706" stroke-width="1.5" />
        <text x="205" y="51" class="rung-title" fill="#fde68a" text-anchor="middle">REFACTOR</text>

        <line x1="320" y1="46" x2="362" y2="46" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow-active)" />

        <rect x="370" y="0" width="525" height="92" rx="8" fill="#111827" stroke="#1E293B" stroke-width="1" />
        <text x="390" y="27" class="card-title">Progression system</text>
        <text x="390" y="49" class="card-desc">Isolated enough to restructure internally,</text>
        <text x="390" y="66" class="card-desc">external behavior held steady throughout.</text>

        <rect x="770" y="14" width="110" height="22" rx="4" fill="#3a2a12" stroke="#d97706" stroke-width="1" />
        <text x="825" y="29" class="badge" fill="#fde68a" text-anchor="middle">SEAM: PARTIAL</text>
    </g>

    <!-- ==================== RUNG 4: REHOST (Bypassed) ==================== -->
    <g transform="translate(0, 454)">
        <rect x="90" y="0" width="230" height="92" rx="8" fill="#0B1120" stroke="#334155" stroke-width="1.5" stroke-dasharray="5,4" />
        <text x="205" y="51" class="rung-title" fill="#64748B" text-anchor="middle">REHOST</text>

        <line x1="320" y1="46" x2="362" y2="46" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)" />

        <rect x="370" y="0" width="525" height="92" rx="8" fill="#0B1120" stroke="#1E293B" stroke-width="1" stroke-dasharray="5,4" />
        <text x="390" y="27" class="card-title" fill="#64748B">Scene streaming / Addressables</text>
        <text x="390" y="49" class="card-desc" fill="#475569">Streaming the scene solves runtime memory and load</text>
        <text x="390" y="66" class="card-desc" fill="#475569">timing, not version control. The actual cause stays intact.</text>

        <rect x="785" y="14" width="95" height="22" rx="4" fill="#1E293B" />
        <text x="832" y="29" class="badge" fill="#64748B" text-anchor="middle">BYPASSED</text>
    </g>

    <!-- ==================== RUNG 5: WRAP (Occupied) ==================== -->
    <g transform="translate(0, 572)">
        <rect x="90" y="0" width="230" height="92" rx="8" fill="#0a1a14" stroke="#10B981" stroke-width="1.5" />
        <text x="205" y="51" class="rung-title" fill="#A7F3D0" text-anchor="middle">WRAP / ENCAPSULATE</text>

        <line x1="320" y1="46" x2="362" y2="46" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-active)" />

        <rect x="370" y="0" width="525" height="92" rx="8" fill="#111827" stroke="#1E293B" stroke-width="1" />
        <text x="390" y="27" class="card-title">Gameplay logic</text>
        <text x="390" y="49" class="card-desc">Interfaces isolated it cleanly.</text>
        <text x="390" y="66" class="card-desc">No internal churn was needed at all.</text>

        <rect x="795" y="14" width="85" height="22" rx="4" fill="#064E3B" stroke="#10B981" stroke-width="1" />
        <text x="837" y="29" class="badge" fill="#A7F3D0" text-anchor="middle">SEAM: YES</text>
    </g>

    <!-- ==================== LEGEND ==================== -->
    <g transform="translate(45, 684)">
        <rect width="850" height="66" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1" />

        <rect x="18" y="16" width="26" height="16" rx="4" fill="#2a0f19" stroke="#e11d48" stroke-width="1" />
        <text x="52" y="28" class="legend-text">Solid, colored rung: landed here this project</text>

        <rect x="18" y="40" width="26" height="16" rx="4" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3" />
        <text x="52" y="52" class="legend-text">Dashed, dim rung: ruled out, nothing landed here</text>

        <text x="460" y="28" class="legend-text">Seam: whether a Feathers-style seam existed here</text>
        <text x="460" y="52" class="legend-text">More seam usually means a cheaper rung was reachable</text>
    </g>
</svg>