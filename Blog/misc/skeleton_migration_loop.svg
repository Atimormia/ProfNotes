<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 920" font-family="Helvetica, Arial, sans-serif">
    <defs>
        <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#4A5568"/>
        </marker>
        <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#2F855A"/>
        </marker>
    </defs>

    <text x="410" y="24" text-anchor="middle" font-size="19" font-weight="600" fill="#1A202C">
        From a Framework Nobody Could Fund to a Skeleton That Could Grow
    </text>

    <!-- Rejected idealized box -->
    <rect x="250" y="44" width="320" height="72" rx="8" fill="#F7FAFC" stroke="#A0AEC0" stroke-width="1.5" stroke-dasharray="6 4"/>
    <line x1="256" y1="50" x2="564" y2="110" stroke="#E53E3E" stroke-width="1.5"/>
    <text x="410" y="68" text-anchor="middle" font-size="13" font-weight="600" fill="#4A5568">Idealized: One Framework</text>
    <text x="410" y="86" text-anchor="middle" font-size="13" font-weight="600" fill="#4A5568">Covering Every Category, Built Upfront</text>
    <text x="410" y="104" text-anchor="middle" font-size="11.5" fill="#9B2C2C">No team. No timeline. Not available.</text>

    <line x1="410" y1="116" x2="410" y2="146" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow2)"/>
    <text x="425" y="135" font-size="11.5" fill="#4A5568">started here instead</text>

    <!-- S0 -->
    <rect x="260" y="150" width="300" height="66" rx="8" fill="#EDF2F7" stroke="#4A5568" stroke-width="1.5"/>
    <text x="410" y="176" text-anchor="middle" font-size="14" font-weight="600" fill="#1A202C">Unstructured Heap of Settings</text>
    <text x="410" y="196" text-anchor="middle" font-size="11.5" fill="#4A5568">No shared shape. No boundary. No owner.</text>

    <line x1="410" y1="216" x2="410" y2="246" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow2)"/>

    <!-- S1 -->
    <rect x="230" y="250" width="360" height="66" rx="8" fill="#EDF2F7" stroke="#4A5568" stroke-width="1.5"/>
    <text x="410" y="276" text-anchor="middle" font-size="14" font-weight="600" fill="#1A202C">Pull Graphics' Hooks From Every Layer</text>
    <text x="410" y="296" text-anchor="middle" font-size="11.5" fill="#4A5568">cvars, GameSettings class, Blueprint, UI markup</text>

    <line x1="410" y1="316" x2="410" y2="346" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow2)"/>

    <!-- S2 -->
    <rect x="200" y="350" width="420" height="76" rx="8" fill="#EDF2F7" stroke="#4A5568" stroke-width="1.5"/>
    <text x="410" y="378" text-anchor="middle" font-size="14" font-weight="600" fill="#1A202C">Build a Skeleton From Graphics' Needs Only</text>
    <text x="410" y="398" text-anchor="middle" font-size="11.5" fill="#4A5568">Generic enough to extend. Not generic in the abstract.</text>
    <text x="410" y="414" text-anchor="middle" font-size="11.5" fill="#4A5568">One category's worth of real data, nothing guessed.</text>

    <line x1="410" y1="426" x2="410" y2="456" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow2)"/>

    <!-- Loop label -->
    <text x="410" y="612" text-anchor="middle" font-size="13" font-weight="600" fill="#2F855A">&#8635; repeat for each new settings category</text>
    <text x="410" y="630" text-anchor="middle" font-size="11.5" fill="#2F855A">old system shrinks by one category each pass, skeleton generalizes by one extension point</text>

    <!-- Loop Top -->
    <rect x="260" y="460" width="300" height="78" rx="8" fill="#F0FFF4" stroke="#38A169" stroke-width="1.5"/>
    <text x="410" y="488" text-anchor="middle" font-size="14" font-weight="600" fill="#22543D">Run Skeleton in Parallel With Old System</text>
    <text x="410" y="508" text-anchor="middle" font-size="11.5" fill="#22543D">Graphics migrated. Everything else untouched.</text>
    <text x="410" y="524" text-anchor="middle" font-size="11.5" fill="#22543D">Nothing forced to move before it's ready.</text>

    <!-- Loop Right -->
    <rect x="640" y="560" width="180" height="100" rx="8" fill="#F0FFF4" stroke="#38A169" stroke-width="1.5"/>
    <text x="730" y="592" text-anchor="middle" font-size="13" font-weight="600" fill="#22543D">Pull Next</text>
    <text x="730" y="610" text-anchor="middle" font-size="13" font-weight="600" fill="#22543D">Category's Hooks</text>
    <text x="730" y="630" text-anchor="middle" font-size="11" fill="#22543D">From every layer,</text>
    <text x="730" y="646" text-anchor="middle" font-size="11" fill="#22543D">same as graphics was</text>

    <!-- Loop Bottom -->
    <rect x="260" y="682" width="300" height="88" rx="8" fill="#F0FFF4" stroke="#38A169" stroke-width="1.5"/>
    <text x="410" y="710" text-anchor="middle" font-size="14" font-weight="600" fill="#22543D">Adjust Skeleton to the New Category's Needs</text>
    <text x="410" y="730" text-anchor="middle" font-size="11.5" fill="#22543D">One more extension point, not a redesign.</text>
    <text x="410" y="746" text-anchor="middle" font-size="11.5" fill="#22543D">Old system loses one more category to the skeleton.</text>

    <!-- Loop Left -->
    <rect x="0" y="560" width="200" height="100" rx="8" fill="#F0FFF4" stroke="#38A169" stroke-width="1.5"/>
    <text x="100" y="592" text-anchor="middle" font-size="13" font-weight="600" fill="#22543D">Skeleton</text>
    <text x="100" y="610" text-anchor="middle" font-size="13" font-weight="600" fill="#22543D">Absorbs the</text>
    <text x="100" y="628" text-anchor="middle" font-size="13" font-weight="600" fill="#22543D">Extension Point</text>

    <!-- Loop connectors, clockwise, orthogonal -->
    <polyline points="560,500 740,500 740,558" fill="none" stroke="#2F855A" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <polyline points="730,660 730,725 562,725" fill="none" stroke="#2F855A" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <polyline points="258,725 100,725 100,662" fill="none" stroke="#2F855A" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <polyline points="100,558 100,500 258,500" fill="none" stroke="#2F855A" stroke-width="2" marker-end="url(#arrowGreen)"/>

    <!-- Exit stub -->
    <line x1="410" y1="770" x2="410" y2="806" stroke="#4A5568" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow2)"/>
    <rect x="210" y="810" width="400" height="76" rx="8" fill="#F7FAFC" stroke="#A0AEC0" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="410" y="838" text-anchor="middle" font-size="13.5" font-weight="600" fill="#4A5568">Old System Empty, Migration Complete</text>
    <text x="410" y="858" text-anchor="middle" font-size="11.5" fill="#718096">Endpoint. Not reached during this pass.</text>
    <text x="410" y="874" text-anchor="middle" font-size="11.5" fill="#718096">One category migrated. The rest is the loop, run again.</text>
</svg>