<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="1000" height="400" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#1A202C">What a Virtual Call Touches</text>
  <text x="500" y="62" text-anchor="middle" font-size="14" fill="#4A5568">Every call reads the object, then the vtable, then jumps. Each step is a dependent load.</text>

  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2B6CB0"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#DD6B20"/>
    </marker>
  </defs>

  <!-- Left panel: instance -->
  <text x="40" y="104" font-size="14" font-weight="bold" fill="#4A5568">AGoblin INSTANCE</text>
  <rect x="40" y="116" width="340" height="132" rx="6" fill="#F7FAFC" stroke="#CBD5E0" stroke-width="1.5"/>

  <!-- vptr row (highlighted) -->
  <rect x="40" y="116" width="340" height="44" rx="6" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="2"/>
  <text x="58" y="144" font-family="Consolas, Menlo, monospace" font-size="15" fill="#718096">+0x00</text>
  <text x="130" y="144" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="bold" fill="#2B6CB0">vptr</text>
  <text x="230" y="144" font-family="Consolas, Menlo, monospace" font-size="14" fill="#4A5568">hidden pointer</text>

  <!-- Health row -->
  <text x="58" y="188" font-family="Consolas, Menlo, monospace" font-size="15" fill="#718096">+0x08</text>
  <text x="130" y="188" font-family="Consolas, Menlo, monospace" font-size="15" fill="#2D3748">float</text>
  <text x="230" y="188" font-family="Consolas, Menlo, monospace" font-size="15" fill="#1A202C">Health</text>

  <!-- Position row -->
  <text x="58" y="228" font-family="Consolas, Menlo, monospace" font-size="15" fill="#718096">+0x0C</text>
  <text x="130" y="228" font-family="Consolas, Menlo, monospace" font-size="15" fill="#2D3748">FVector</text>
  <text x="230" y="228" font-family="Consolas, Menlo, monospace" font-size="15" fill="#1A202C">Position</text>

  <!-- Arrow: vptr -> vtable slot 0 -->
  <line x1="382" y1="138" x2="578" y2="138" stroke="#2B6CB0" stroke-width="3.5" marker-end="url(#arrowBlue)"/>

  <!-- Right panel: vtable -->
  <text x="600" y="104" font-size="14" font-weight="bold" fill="#4A5568">VTABLE FOR AGoblin</text>
  <rect x="580" y="116" width="380" height="88" rx="6" fill="#F7FAFC" stroke="#CBD5E0" stroke-width="1.5"/>

  <!-- slot 0 (highlighted) -->
  <rect x="580" y="116" width="380" height="44" rx="6" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="2"/>
  <text x="598" y="144" font-family="Consolas, Menlo, monospace" font-size="15" fill="#718096">[0]</text>
  <text x="650" y="144" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="bold" fill="#2B6CB0">&amp;AGoblin::OnTakeDamage</text>

  <!-- slot 1 -->
  <text x="598" y="188" font-family="Consolas, Menlo, monospace" font-size="15" fill="#718096">[1]</text>
  <text x="650" y="188" font-family="Consolas, Menlo, monospace" font-size="15" fill="#2D3748">&amp;AGoblin::OnDeath</text>

  <!-- Arrow: slot 0 -> code -->
  <line x1="770" y1="204" x2="770" y2="276" stroke="#DD6B20" stroke-width="3.5" marker-end="url(#arrowOrange)"/>

  <!-- Code target -->
  <rect x="580" y="282" width="380" height="44" rx="6" fill="#FFFAF0" stroke="#DD6B20" stroke-width="2"/>
  <text x="598" y="310" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="bold" fill="#DD6B20">AGoblin::OnTakeDamage</text>
  <text x="840" y="310" font-family="Consolas, Menlo, monospace" font-size="14" fill="#4A5568">machine code</text>

  <!-- Step callouts -->
  <text x="40" y="288" font-size="13" font-weight="bold" fill="#2B6CB0">1. Read the object to get vptr</text>
  <text x="40" y="310" font-size="13" font-weight="bold" fill="#2B6CB0">2. Read the vtable slot to get the target</text>
  <text x="40" y="332" font-size="13" font-weight="bold" fill="#DD6B20">3. Indirect jump to code the compiler could not see</text>

  <!-- Bottom note -->
  <text x="500" y="376" text-anchor="middle" font-size="13" fill="#4A5568">One call is cheap. Thousands of scattered objects with mixed types per frame is where it adds up.</text>
</svg>
